<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Background decorative ring -->
  <circle cx="256" cy="256" r="180" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" fill="none" />
  <circle cx="256" cy="256" r="140" fill="#1e293b" fill-opacity="0.6" filter="url(#glow)" />

  <!-- Marching Band Drum Body -->
  <g transform="translate(0, -10)">
    <!-- Snare Drum Outer Rim -->
    <ellipse cx="256" cy="210" rx="120" ry="40" fill="#f8fafc" stroke="url(#goldGrad)" stroke-width="8" />
    <ellipse cx="256" cy="210" rx="105" ry="32" fill="#e2e8f0" />
    
    <!-- Drum Shell Body -->
    <path d="M 136,210 L 136,310 C 136,345 376,345 376,310 L 376,210 Z" fill="url(#drumGrad)" stroke="url(#goldGrad)" stroke-width="6" />
    
    <!-- Drum Tension Rods / Zigzag Pattern -->
    <path d="M 150,218 L 190,325 L 230,222 L 270,328 L 310,222 L 350,325 L 362,218" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Drum Bottom Rim -->
    <ellipse cx="256" cy="310" rx="120" ry="36" fill="none" stroke="url(#goldGrad)" stroke-width="8" />

    <!-- Crossed Drumsticks -->
    <g stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round">
      <!-- Left to Right Stick -->
      <line x1="160" y1="140" x2="350" y2="350" />
      <circle cx="160" cy="140" r="9" fill="#fef08a" />
      
      <!-- Right to Left Stick -->
      <line x1="352" y1="140" x2="162" y2="350" />
      <circle cx="352" cy="140" r="9" fill="#fef08a" />
    </g>
  </g>

  <!-- Modern QR / Badge Emblem at Bottom Center -->
  <g transform="translate(256, 400)">
    <rect x="-85" y="-22" width="170" height="44" rx="22" fill="url(#blueGrad)" filter="url(#glow)" />
    <text x="0" y="7" fill="#ffffff" font-size="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">
      FMB ABSENSI
    </text>
  </g>

  <!-- Sparkles / Stars -->
  <polygon points="130,120 135,135 150,140 135,145 130,160 125,145 110,140 125,135" fill="#fef08a" opacity="0.9" />
  <polygon points="380,120 385,135 400,140 385,145 380,160 375,145 360,140 375,135" fill="#fef08a" opacity="0.9" />
</svg>
